name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      # pnpm の版は package.json の packageManager から読む
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm fmt:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      # ビルドだけで起きる失敗（SH_E2E の止め、Paraglide のプラグインの取得、Void のビルド）も拾う。
      # SH_E2E があるとビルドを止めるので、外して実行する。
      - name: Build
        run: env -u SH_E2E pnpm build

  # 本物のブラウザ（Chromium）で void dev のアプリを動かし、手元の moq-relay を通して遊ぶ（tests/e2e）。
  # Cloudflare 専用の依存は SH_E2E=1 で手元の代わりに差し替わるので、秘密情報は使わない。
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      # pnpm の版は package.json の packageManager から読む
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm e2e
      - name: Upload Playwright report
        # retries: 1 で 2 回目に通った（不安定な）テストの記録も残す
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
