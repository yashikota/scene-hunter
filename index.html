<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scene Hunter</title>
    <meta
      name="description"
      content="ゲームマスター（GM）が撮った景色を、AI のヒントを頼りに探して撮る、写真さがしのパーティーゲーム。登録なし、無料、ブラウザだけで遊べます。"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 部屋のリンクを送ったときのプレビュー。og:image は絶対 URL が要る。 -->
    <meta property="og:title" content="Scene Hunter" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://game.scene-hunter.workers.dev/" />
    <meta property="og:image" content="https://game.scene-hunter.workers.dev/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- タイトルのロゴは言語によらず同じフォントにする。使う文字だけを取る（text=）。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&text=Scene%20Hunter&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
